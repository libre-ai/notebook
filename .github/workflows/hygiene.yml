name: hygiene

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reuse:
    name: REUSE compliance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      # Pinned tool version, run through uv: the machine doctrine bans `pip
      # install` and manual virtualenvs. `charset-normalizer` gives the linter
      # the encoding detection it needs on non-UTF-8 inputs.
      - name: Lint per-path licence declarations
        run: uvx --from 'reuse[charset-normalizer]==6.2.0' reuse lint

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Required repository policy files
        run: |
          set -euo pipefail
          test -s README.md
          test -s CONTRIBUTING.md
          test -s ROADMAP.md
          test -s SECURITY.md
          test -s LICENSE
          test -s .github/CODEOWNERS
      - name: Secret pattern smoke
        run: |
          set -euo pipefail
          if git grep -nEI '(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN (RSA|DSA|EC|OPENSSH) PRIVATE KEY-----)' -- ':!Cargo.lock' ':!package-lock.json'; then
            echo "::error::potential secret pattern found"
            exit 1
          fi
