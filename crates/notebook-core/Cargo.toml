[package]
name = "libre-ai-notebook-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
default = []
# Qualification-only sentinels compile internal panic/OOM paths into a separate ignored artifact.
qualification-faults = []

[dependencies]
# `aes` stays a direct dependency for the compile-time `ZeroizeOnDrop` and
# fixslice-width assertions in crypto.rs; the wipe chain below it is proven by
# `scripts/check-zeroize-chain.ts`, not by direct feature anchors.
aes.workspace = true
aes-gcm.workspace = true
argon2.workspace = true
base64.workspace = true
cpubits.workspace = true
serde.workspace = true
serde_jcs.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
wit-bindgen.workspace = true
zeroize.workspace = true

[dev-dependencies]
wasmparser.workspace = true
wit-component.workspace = true

# `cpubits!` expands to `cfg(cpubits = "...")` predicates inside this crate;
# declared here so `unexpected_cfgs` stays a real lint rather than noise.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(cpubits, values("16", "32", "64"))'] }
